<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业加班费核算实务要点 |梅律小记</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1 class="blog-title">梅律小记</h1>
            <nav class="main-nav">
                <a href="index.html">首页</a>
                <a href="articles.html">文章</a>
                <a href="tags.html">标签</a>
                <a href="about.html">关于我</a>
            </nav>
        </div>
    </header>

    <div class="container main-wrap">
        <main class="content">
            <h1 id="post-title"></h1>
<div id="post-meta" class="post-meta"></div>
<div id="post-body"></div>
        </main>
        <aside class="sidebar">
            <div class="widget">
                <h3 class="widget-title">搜索</h3>
                <div class="search-box">
                    <input type="text" placeholder="输入关键词搜索文章">
                    <button type="submit">🔍</button>
                </div>
            </div>
            <div class="widget">
                <h3 class="widget-title">网站分类</h3>
                <ul class="category-list">
                    <li><a href="#">用工合规 (17)</a></li>
                    <li><a href="#">AI数据合规 (9)</a></li>
                    <li><a href="#">婚家商事 (12)</a></li>
                    <li><a href="#">劳动仲裁实务 (23)</a></li>
                </ul>
            </div>
            <div class="widget">
                <h3 class="widget-title">订阅博客</h3>
                <p>微信公众号订阅</p>
                <div class="qrcode">
                    <img src="https://via.placeholder.com/200x200" alt="公众号二维码">
                </div>
            </div>
        </aside>
    </div>
    <footer class="site-footer">
        <div class="container">© 2026 梅律小记</div>
    </footer>
    <script src="js/script.js"></script>
    <script>
async function loadSinglePost() {
  const params = new URLSearchParams(window.location.search);
  const file = params.get("file");
  if(!file) {
    document.querySelector("#post-body").innerHTML = "<p>文章不存在，请返回文章列表</p>";
    return;
  }
  const res = await fetch(`posts/${file}`);
  const raw = await res.text();
  const fmMatch = raw.match(/---\n([\s\S]*?)\n---\n([\s\S]*)/);
  if(!fmMatch) return;
  const front = fmMatch[1];
  const contentMd = fmMatch[2];
  const post = {};
  front.split("\n").forEach(line=>{
    const [k, v] = line.split(": ");
    if(k && v) post[k.trim()] = v.trim();
  })
  document.querySelector("#post-title").innerText = post.title;
  document.querySelector("#post-meta").innerText = `${post.date} | 作者：刘律 | 分类：${post.category}`;
  document.querySelector("#post-body").innerHTML = marked.parse(contentMd);
}
loadSinglePost();
</script>
</body>
</html>
