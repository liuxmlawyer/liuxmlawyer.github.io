<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全部文章 | 刘律大法师的法律博客</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1 class="blog-title">刘律大法师的法律博客</h1>
            <nav class="main-nav">
                <a href="index.html">首页</a>
                <a href="articles.html">文章</a>
                <a href="tags.html">标签</a>
                <a href="about.html">关于我</a>
            </nav>
        </div>
    </header>

    <div class="container main-wrap">
        <main class="content">
            <h2>全部文章</h2>
            <div id="article-list"></div>
        </main>
        <aside class="sidebar">
            <div class="widget">
                <h3 class="widget-title">搜索</h3>
                <div class="search-box">
                    <input type="text" placeholder="输入关键词搜索文章">
                    <button type="submit">🔍</button>
                </div>
            </div>
            <div class="widget">
                <h3 class="widget-title">网站分类</h3>
                <ul class="category-list">
                    <li><a href="#">用工合规 (17)</a></li>
                    <li><a href="#">AI数据合规 (9)</a></li>
                    <li><a href="#">婚家商事 (12)</a></li>
                    <li><a href="#">劳动仲裁实务 (23)</a></li>
                </ul>
            </div>
            <div class="widget">
                <h3 class="widget-title">订阅博客</h3>
                <p>微信公众号订阅</p>
                <div class="qrcode">
                    <img src="https://via.placeholder.com/200x200" alt="公众号二维码">
                </div>
            </div>
        </aside>
    </div>
    <footer class="site-footer">
        <div class="container">© 2026 刘律大法师的法律博客</div>
    </footer>
    <script src="js/script.js"></script>
    <script>
// 读取posts目录md文章列表
async function loadPosts() {
  const postsList = [
    "2026-09-17-labor-dispute.md"
  ];
  const posts = [];
  for (const filename of postsList) {
    const res = await fetch(`posts/${filename}`);
    const raw = await res.text();
    // 简单解析markdown frontmatter
    const fmMatch = raw.match(/---\n([\s\S]*?)\n---\n([\s\S]*)/);
    if (!fmMatch) continue;
    const front = fmMatch[1];
    const content = fmMatch[2];
    const post = {};
    front.split("\n").forEach(line=>{
      const [k, v] = line.split(": ");
      if(k && v) post[k.trim()] = v.trim();
    })
    post.filename = filename;
    post.content = content;
    posts.push(post);
  }
  // 按日期倒序
  posts.sort((a,b)=> new Date(b.date) - new Date(a.date));
  renderArticleList(posts);
}

// 渲染文章列表，复用你现有的post-item样式
function renderArticleList(posts) {
  const container = document.getElementById("article-list");
  if(!container) return;
  container.innerHTML = "";
  posts.forEach(p=>{
    const div = document.createElement("article");
    div.className = "post-item";
    div.innerHTML = `
      <h2 class="post-title"><a href="post.html?file=${p.filename}">${p.title}</a></h2>
      <div class="post-meta">${p.date} | 作者：刘律 | 分类：${p.category}</div>
      <div class="post-excerpt">
        <p>${p.summary}</p>
      </div>
    `
    container.appendChild(div);
  })
}
loadPosts();
</script>
</body>
</html>
